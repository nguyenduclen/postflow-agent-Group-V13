name: Build PostFlow Agent V13 PAGE GROUP SCAN STRICT

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build PostFlow Agent V13
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
          cache-disabled: true

      - name: Locate V12.1 Android source
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          WORK="$RUNNER_TEMP/postflow-v13"
          rm -rf "$WORK"
          mkdir -p "$WORK"

          ZIP="$(find "$ROOT" -maxdepth 3 -type f \
            -iname 'PostFlow-Agent-FINAL-PAGE-PROFILE-GROUP-AUTO-V13-PAGE-GROUP-SCAN-STRICT.zip' \
            ! -path '*/.git/*' -print -quit)"

          if [ -z "$ZIP" ]; then
            echo "::error::Không tìm thấy source ZIP V12 chính xác."
            find "$ROOT" -maxdepth 3 -type f -not -path '*/.git/*' | sort
            exit 1
          fi

          echo "Source ZIP: $ZIP"
          unzip -q -o "$ZIP" -d "$WORK"

          SETTINGS="$(find "$WORK" -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::ZIP V12 không chứa Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify V13 source
        shell: bash
        run: |
          set -euo pipefail
          P="$PROJECT_DIR"
          test -f "$P/app/build.gradle"
          test -f "$P/app/src/main/AndroidManifest.xml"
          SERVICE="$P/app/src/main/java/vn/phutungmaykubota/postflowagent/PostFlowAccessibilityService.java"
          test -f "$SERVICE"
          test -f "$P/app/src/main/java/vn/phutungmaykubota/postflowagent/MainActivity.java"
          test -f "$P/app/src/main/java/vn/phutungmaykubota/postflowagent/AgentSync.java"
          grep -q "versionCode 52" "$P/app/build.gradle"
          grep -q "V13" "$SERVICE" || grep -q "requestPageGroupScan" "$SERVICE"
          grep -q "pageGroupsNavigationAttempted" "$SERVICE"
          grep -q "isPageGroupsContext" "$SERVICE"
          grep -q "collectGroupEntriesFromTree" "$SERVICE"
          grep -q "prePageGroupsNavigationSignature" "$SERVICE"
          grep -q "findSpecificPageUrlInTexts" "$SERVICE"
          echo "V13 SOURCE CHECK OK"

      - name: Validate XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$PROJECT_DIR/app/src/main" <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path(sys.argv[1])
          for p in root.rglob("*.xml"):
              ET.parse(p)
              print("XML OK:", p)
          PY

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euxo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace clean assembleDebug
          else
            gradle --no-daemon --stacktrace clean assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          mkdir -p "$GITHUB_WORKSPACE/final-apk"
          cp "$APK" "$GITHUB_WORKSPACE/final-apk/PostFlow-Agent-V13-PAGE-GROUP-SCAN-STRICT.apk"
          unzip -t "$GITHUB_WORKSPACE/final-apk/PostFlow-Agent-V13-PAGE-GROUP-SCAN-STRICT.apk" >/dev/null
          ls -lh "$GITHUB_WORKSPACE/final-apk/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostFlow-Agent-V13-PAGE-GROUP-SCAN-STRICT
          path: final-apk/PostFlow-Agent-V13-PAGE-GROUP-SCAN-STRICT.apk
          if-no-files-found: error
          retention-days: 30
